name: "Build unsigned release APK on main"

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'main'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Build release APK"
        run: ./gradlew assembleRelease --stacktrace

      - name: "Rename APK"
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/release/output-metadata.json")"
          echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "app/build/outputs/apk/release/output-metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # assume there is only one APK in that folder
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/BearTube_v$VERSION_NAME.apk"

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: BearTube-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(gh release list --limit 20 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [ -z "$RELEASE_TAG" ]; then
            echo "No published GitHub Release found to attach the APK to." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/*.apk --clobber
