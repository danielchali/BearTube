name: Build Windows desktop installers

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-installers:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build Windows EXE and MSI installers
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi --stacktrace --no-daemon

      - name: Upload Windows installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BearTube-Windows-installers-${{ github.run_number }}
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Attach installers to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(
            Get-ChildItem -Path 'desktopApp/build/compose/binaries/main/exe/*.exe' -File | ForEach-Object FullName
            Get-ChildItem -Path 'desktopApp/build/compose/binaries/main/msi/*.msi' -File | ForEach-Object FullName
          )
          gh release upload $env:RELEASE_TAG $files --clobber
